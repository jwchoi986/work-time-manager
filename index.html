<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 인턴 다이어리</title>
<link rel="stylesheet" href="style.css">
<script src="diary.js"></script>
<script src="mindset.js"></script>
<script src="transition.js" defer></script>
<style>
  .diary-header {
    width: 100%;
    text-align: center;
    padding: 12px 0 4px;
  }
  .diary-date {
    font-size: 30px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .diary-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .diary-card {
    padding: 32px 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .diary-card-icon {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: var(--peach-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 12px;
  }
  .diary-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 18px;
  }
  .diary-card-body {
    width: 100%;
    flex: 1;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .diary-empty {
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
    margin: 0;
  }
  .stat-row {
    display: flex;
    justify-content: center;
    gap: 32px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--peach-text);
    font-variant-numeric: tabular-nums;
  }
  .home-task-textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
    color: var(--text);
    background: #fffdf9;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
    text-align: left;
  }
  .home-task-textarea:focus {
    outline: none;
    border-color: var(--peach);
    box-shadow: 0 0 0 4px var(--peach-soft);
  }
  .home-task-textarea::placeholder {
    color: var(--muted);
  }
  .home-task-actions {
    width: 100%;
    display: flex;
    gap: 10px;
  }
  .home-task-actions .secondary,
  .home-task-actions .diary-card-btn {
    flex: 1;
    margin-top: 0;
  }
  .diary-card-btn {
    display: block;
    width: 100%;
    padding: 12px 20px;
    border: none;
    border-radius: 999px;
    background: var(--button-gradient);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
  }
  .diary-card-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -12px var(--button-shadow);
  }
  @media (max-width: 640px) {
    .diary-grid { grid-template-columns: 1fr; }
  }
  .earnings-inline {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin: -8px 0 4px;
  }
  .earnings-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .earnings-value {
    font-size: 15px;
    font-weight: 800;
    color: var(--peach-text);
    font-variant-numeric: tabular-nums;
  }
  .quote-panel {
    display: block;
    width: 100%;
    position: relative;
    overflow: hidden;
    padding-top: 24px;
    padding-right: 24px;
    padding-bottom: 20px;
    padding-left: 190px;
    background-color: rgba(255, 255, 255, 0.7);
    background-image: url('https://i.pinimg.com/736x/52/87/5c/52875cd600de977568c5be9178337293.jpg');
    background-repeat: no-repeat;
    background-position: 30px center;
    background-size: auto 70%;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
  }
  .quote-panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 44px -20px rgba(255, 180, 143, 0.5);
  }
  .quote-decor {
    text-align: right;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--peach-text);
    opacity: 0.55;
    white-space: nowrap;
    margin-bottom: 4px;
    pointer-events: none;
  }
  .page-quote {
    width: 100%;
    margin: 0;
    text-align: right;
    color: var(--muted-strong);
    font-size: 14px;
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    .quote-panel {
      padding: 120px 18px 20px;
      background-position: center 16px;
      background-size: auto 90px;
    }
    .quote-decor {
      text-align: center;
      white-space: normal;
    }
    .page-quote {
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="diary-header">
      <div class="diary-date" id="diaryDate"></div>
    </header>

    <div class="earnings-inline">
      <span class="earnings-label">지금까지 번 돈 💰</span>
      <span class="earnings-value" id="earningsValue">₩0</span>
    </div>

    <div class="diary-grid">
      <div class="panel diary-card">
        <div class="diary-card-icon">🕒</div>
        <h2 class="diary-card-title">출퇴근</h2>
        <div class="diary-card-body" id="attendanceBody"></div>
        <a class="diary-card-btn" href="attendance.html" data-nav>출퇴근 관리</a>
      </div>

      <div class="panel diary-card">
        <div class="diary-card-icon">📝</div>
        <h2 class="diary-card-title">오늘의 업무</h2>
        <textarea id="homeTasksInput" class="home-task-textarea" placeholder="오늘 한 일을 적어보세요"></textarea>
        <div class="home-task-actions">
          <button type="button" class="secondary" id="homeTaskSaveBtn" onclick="saveTasksFromHome()">저장하기</button>
          <a class="diary-card-btn" href="worklog.html" data-nav>업무 내용 관리</a>
        </div>
      </div>
    </div>

    <a class="panel quote-panel" href="mindset.html" data-nav>
      <div class="quote-decor">.・。.・゜✭・.・✫・゜・。.</div>
      <p class="page-quote" id="quoteText"></p>
    </a>
  </div>

<script>
function renderQuotePreview() {
  const entry = getDisplayedMindsetEntry();
  document.getElementById('quoteText').innerHTML = entry.text.split('\n').map(escapeHtml).join('<br>');
}

function renderAttendanceCard() {
  const entry = getTodayEntry();
  const body = document.getElementById('attendanceBody');

  if (!entry || !entry.clockIn || !entry.clockOut) {
    body.innerHTML = '<p class="diary-empty">아직 기록된 내용이 없습니다.</p>';
    return;
  }

  body.innerHTML = `
    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">출근</div>
        <div class="stat-value">${entry.clockIn}</div>
      </div>
      <div class="stat">
        <div class="stat-label">퇴근 예정</div>
        <div class="stat-value">${entry.clockOut}</div>
      </div>
    </div>
  `;
}

function renderTasksCard() {
  const entry = getTodayEntry();
  document.getElementById('homeTasksInput').value = (entry && entry.tasks) || '';
}

function saveTasksFromHome() {
  const diary = loadDiary();
  const dateIso = todayIso();
  diary[dateIso] = { ...diary[dateIso], tasks: document.getElementById('homeTasksInput').value };
  saveDiary(diary);

  const btn = document.getElementById('homeTaskSaveBtn');
  const original = btn.textContent;
  btn.textContent = '저장됨 ✓';
  setTimeout(() => { btn.textContent = original; }, 1200);
}

const DAILY_WAGE = 100000;
const DAILY_WORK_MINUTES = 9 * 60;
const WAGE_PER_MINUTE = DAILY_WAGE / DAILY_WORK_MINUTES;

function updateEarnings() {
  const entry = getTodayEntry();
  const valueEl = document.getElementById('earningsValue');

  if (!entry || !entry.clockIn) {
    valueEl.textContent = '₩0';
    return;
  }

  const now = new Date();
  const [inH, inM] = entry.clockIn.split(':').map(Number);
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), inH, inM, 0, 0);
  const elapsedMinutes = Math.max(0, (now - start) / 60000);
  const cappedMinutes = Math.min(elapsedMinutes, DAILY_WORK_MINUTES);
  const earned = Math.floor(cappedMinutes * WAGE_PER_MINUTE);

  valueEl.textContent = `₩${earned.toLocaleString('ko-KR')}`;
}

document.getElementById('diaryDate').textContent = formatFullDateLabel(todayIso());
renderAttendanceCard();
renderTasksCard();
renderQuotePreview();
updateEarnings();
setInterval(updateEarnings, 1000);
</script>
</body>
</html>
